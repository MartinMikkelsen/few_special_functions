[package]
name = "few_special_functions"
version = "0.1.6"
edition = "2024"
rust-version = "1.96"
description = "Special functions matching the FewSpecialFunctions.jl API"
keywords = ["mathematics", "special-functions", "numerics", "functions"]   # max 5
categories = ["mathematics", "science"]
license = "MIT"
repository = "https://github.com/MartinMikkelsen/few_special_functions"
documentation = "https://docs.rs/few_special_functions"
readme = "README.md"

[dependencies]
libm = "0.2"
num-complex = "0.4"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "full_palette"] }

[[bench]]
name = "benchmarks"
harness = false
